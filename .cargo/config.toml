[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
asan-test = [
    "test",
    "--tests",
    "--release",
    "--target", "x86_64-unknown-linux-gnu",
    "--config", "target.x86_64-unknown-linux-gnu.rustflags=['-Zsanitizer=address', '-C', 'debuginfo=1']"
]
tsan-test = [
    "test",
    "--tests",
    "-Zbuild-std=std,panic_unwind",
    "--release",
    "--target", "x86_64-unknown-linux-gnu",
    "--config", "profile.release.panic='unwind'",
    "--config", "target.x86_64-unknown-linux-gnu.rustflags=['-Zsanitizer=thread', '-C', 'debuginfo=1']"
]


[env]
ASAN_OPTIONS = "detect_leaks=1:symbolize=1:quarantine_size_mb=64"
TSAN_OPTIONS = "second_deadlock_stack=1"