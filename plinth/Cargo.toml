[package]
name = "plinth"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
opt-level = 3
panic = "abort"


[features]
bench = ["dep:criterion"]

[dependencies]
arrow = "59.2.0"
tracing = "0.1.44"
criterion = { version = "0.8.2", optional = true }

[dev-dependencies]
#shuttle = "0.9.1"

[[bench]]
name = "column"
harness = false